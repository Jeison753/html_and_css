<body>

  <h1>Actividad 1.2 - Calculadora básica</h1>

  <script>

    // Nombre: Jeison Felipe Duarte Porras
    // Ficha: 3312694
    // Actividad: 1.2 - Calculadora basica

    const sumar = (a, b) => a + b;

    const restar = (a, b) => a - b;

    const multiplicar = (a, b) => a * b;

    const dividir = (a, b) => {

      if (b === 0) {
        return "Error: división por cero";
      }

      return a / b;
    };

    const numero1 = Number(prompt("Ingrese el primer número:"));
    const numero2 = Number(prompt("Ingrese el segundo número:"));

    console.log("Suma:", sumar(numero1, numero2));
    console.log("Resta:", restar(numero1, numero2));
    console.log("Multiplicación:", multiplicar(numero1, numero2));
    console.log("División:", dividir(numero1, numero2));

  </script>

</body>
